let L='en';try{L=localStorage.getItem('lang')||(/^es/i.test(navigator.language)?'es':'en')}catch(e){}
const tx=x=>typeof x==='string'?x:x[L==='es'?1:0];
const LB={Sm:"Peq.",Lg:"Gde.",pc:"pz"};
const lbl=l=>L==='es'?l.replace(/\b(Sm|Lg|pc)\b/g,m=>LB[m]):l;
function pr(s){return `<div class="pr">${s.split('|').map(x=>{if(/^(N\/C|\+?\d)/.test(x)&&!/\s/.test(x)){return `<span class="ch"><b>${/^\d/.test(x)?'$'+x:(x[0]==='+'?'+$'+x.slice(1):x)}</b></span>`}const k=x.lastIndexOf(' ');return `<span class="ch">${k>0?`<i>${lbl(x.slice(0,k))}</i>`:''}<b>${/^[+\d]/.test(x.slice(k+1))?(x[k+1]==='+'?'+$'+x.slice(k+2):'$'+x.slice(k+1)):x.slice(k+1)}</b></span>`}).join('')}</div>`}
function pv(v){if(Array.isArray(v))v=tx(v);return v}
function draw(){
 document.documentElement.lang=L;
 document.title=L==='es'?"Mike’s Sandwich Shop · Menú":"Mike’s Sandwich Shop · Menu";
 document.querySelectorAll('[data-es]').forEach(e=>{if(!e.dataset.en)e.dataset.en=e.innerHTML;e.innerHTML=L==='es'?e.dataset.es:e.dataset.en});
 const nav=document.getElementById('nav'),m=document.getElementById('menu');
 nav.innerHTML=`<div class="lang"><button data-l="en" aria-pressed="${L==='en'}">EN</button><button data-l="es" aria-pressed="${L==='es'}">ES</button></div>`+D.map(s=>`<a href="#${s.id}">${s.ic} ${tx(s.t)}</a>`).join('');
 m.innerHTML=D.map(s=>`<section id="${s.id}"><h2>${s.ic} ${tx(s.t)}</h2><div class="cols">`+s.g.map(g=>`<div class="cd"><h3><span>${tx(g.n)}</span>${g.p?`<em>${tx(g.p)}</em>`:''}</h3>${g.note?`<p class="nt">${tx(g.note)}</p>`:''}`+g.i.map(i=>`<div class="it"><div><div class="nm">${tx(i[0])}</div>${i[2]?`<div class="ds">${tx(i[2])}</div>`:''}</div>${i[1]?pr(pv(i[1])):''}</div>`).join('')+`</div>`).join('')+`</div></section>`).join('');
}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-l]');if(b){L=b.dataset.l;try{localStorage.setItem('lang',L)}catch(x){}draw()}});
draw();
